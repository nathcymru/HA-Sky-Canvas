name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- custom_components/ha_sky_canvas/frontend/sky-canvas.js
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.4 pytest==9.2.0 pytest-asyncio==1.4.1 ruff==0.17.0 Pillow==12.3.0
      - run: ruff check custom_components tests/python
      - run: ruff format --check custom_components tests/python
      - run: python -m pytest
