# Install under /config/themes, reload themes, then select this theme per Weather view.
# Forecast presentation inspired by the Met Office forecast page and user-supplied specimen.
# This community integration uses Met Office data; it is not an official Met Office app.
Sky Canvas Met Office:
  primary-color: '#c4e90c'
  accent-color: '#c4e90c'
  primary-background-color: '#147bbe'
  secondary-background-color: '#114465'
  lovelace-background: '#147bbe'
  card-background-color: '#114465'
  ha-card-background: '#114465'
  primary-text-color: '#ffffff'
  secondary-text-color: '#d7e5ee'
  text-primary-color: '#1d1d1d'
  disabled-text-color: '#b9cbd7'
  divider-color: 'rgba(255,255,255,0.2)'
  app-header-background-color: '#1d1d1d'
  app-header-text-color: '#ffffff'
  app-header-selection-bar-color: '#c4e90c'
  ha-card-border-color: 'rgba(255,255,255,0.15)'
  ha-card-border-radius: '12px'
  ha-card-box-shadow: 'none'
  paper-item-icon-color: '#d7e5ee'
  paper-item-icon-active-color: '#c4e90c'
  input-fill-color: '#114465'
  input-ink-color: '#ffffff'
  input-label-ink-color: '#d7e5ee'
  state-icon-color: '#d7e5ee'
  state-icon-active-color: '#c4e90c'
